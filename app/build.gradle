plugins {
    id 'com.android.application'
}

android {
    namespace "com.lince.control"
    compileSdk 34

    defaultConfig {
        applicationId "com.mudanzasellince.control"
        minSdk 29
        targetSdk 34
        versionCode 100 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "3.4.7"
    }

    signingConfigs {
        release {
            storeFile file(LINCE_STORE_FILE)
            storePassword LINCE_STORE_PASSWORD
            keyAlias LINCE_KEY_ALIAS
            keyPassword LINCE_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
