name: Build Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.LINCE_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lince-release.jks"
      - name: Build release
        env:
          ORG_GRADLE_PROJECT_LINCE_STORE_FILE: ${{ runner.temp }}/lince-release.jks
          ORG_GRADLE_PROJECT_LINCE_STORE_PASSWORD: ${{ secrets.LINCE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LINCE_KEY_ALIAS: ${{ secrets.LINCE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LINCE_KEY_PASSWORD: ${{ secrets.LINCE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
